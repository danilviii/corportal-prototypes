:root{
  --primary:#2e60f2;--primary-h:#1d4ed8;--primary-6:rgba(46,96,242,.06);--primary-12:rgba(46,96,242,.12);
  --text:#0f172a;--text-2:#3d4c6a;--muted:#778297;--border:#e9e9f1;--border-2:#d7dae0;
  --bg:#f3f3f6;--bg-2:#fbfbfc;--white:#fff;--rail:#1a2553;
  --red:#d22422;--red-bg:#fcf3f2;--green:#357f3e;--green-bg:#e2fbe8;--yellow:#a16207;--yellow-bg:#fdf9c8;
  --orange:#e15705;--orange-bg:#fef7ee;--purple:#7e22ce;--purple-bg:#f1e9fd;--blue-bg:#deeafc;
  --shadow:5px 5px 40px rgba(36,40,43,.1);--shadow-xl:5px 5px 60px rgba(36,40,43,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:500;font-size:13px;color:var(--text);background:#dfe3ea;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.ic{flex-shrink:0;display:block}
.muted{color:var(--muted)}
.t2{color:var(--text-2)}
.nowrap{white-space:nowrap}
.tab-num{font-variant-numeric:tabular-nums}

/* ---------- prototype bar ---------- */
#bar{flex:0 0 auto;background:#0f172a;color:#e2e8f0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;font-size:12px;z-index:100}
#bar .lbl{color:#94a3b8;font-weight:600;margin-right:2px}
#bar .sep{width:1px;height:22px;background:#334155;margin:0 4px}
.rb{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;padding:3px 8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;text-align:left}
.rb b{font-size:11px;font-weight:700}
.rb span{font-size:10px;color:#94a3b8}
.rb.on{background:var(--primary);border-color:var(--primary)}
.rb.on span{color:#dbeafe}
.bb{height:28px;padding:0 9px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px}
.bb:hover{background:#334155}
.bb.on{background:#7e22ce;border-color:#7e22ce}
#bar select{max-width:200px}
#bar select,#bar input{height:28px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;padding:0 6px;font-size:12px}
#bar input{width:70px}

/* ---------- stage / app ---------- */
#stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
#stage.mobile{padding:14px;background:#cbd2dc}
#app{position:relative;flex:1;min-width:0;display:flex;background:var(--bg);overflow:hidden;container-type:inline-size;container-name:app}
#stage.mobile #app{flex:0 0 375px;width:375px;border-radius:22px;border:6px solid #111827;box-shadow:var(--shadow-xl)}

.rail{width:44px;flex:0 0 44px;background:linear-gradient(180deg,#1a2553,#233a89);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;color:#c7d2fe}
.rail .logo{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:6px}
.rail button{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#c7d2fe;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.rail button:hover{background:rgba(255,255,255,.1);color:#fff}
.rail button.on{background:rgba(255,255,255,.16);color:#fff}
.rail .sp{flex:1}
.badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

.side{width:212px;flex:0 0 212px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:auto;padding:8px 8px 16px}
.side h3{margin:2px 6px 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mi{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;color:var(--text-2);cursor:pointer;font-weight:600;font-size:12.5px;border:0;background:transparent;width:100%;text-align:left}
.mi:hover{background:var(--bg)}
.mi.on{background:var(--bg);color:var(--text)}
.mi .ic{color:var(--muted)}
.mi.on .ic{color:var(--text)}
.side .hr{height:1px;background:var(--border);margin:8px 2px}
.sub{display:flex;align-items:center;gap:6px;min-height:24px;padding:3px 8px 3px 18px;border-radius:6px;color:var(--text-2);cursor:pointer;font-size:12px;border:0;background:transparent;width:100%;text-align:left}
.sub:before{content:"•";color:var(--border-2)}
.sub:hover{background:var(--bg)}
.sub.on{background:var(--bg);color:var(--text);font-weight:700}
.sub.lvl2{padding-left:30px}
.sub.lvl2:before{content:"◦"}
.sgrp{font-size:10.5px;color:var(--muted);font-weight:700;margin:10px 8px 4px;text-transform:none}
.srow{display:flex;align-items:center;gap:2px;border-radius:6px;margin-top:2px;position:relative}
.srow:hover,.srow.on{background:var(--bg)}
.srow .sname{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border:0;background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text);text-align:left}
.srow .sname .ic{color:var(--muted)}
.srow .dots{width:22px;height:22px;border:0;background:transparent;border-radius:4px;cursor:pointer;color:var(--muted);display:grid;place-items:center;opacity:0}
.srow:hover .dots,.srow .dots.on{opacity:1}
.srow .dots:hover,.srow .dots.on{background:#e4e5ec;color:var(--text)}
.srow.lvl2{margin-top:0}
.stree{margin:0 0 4px 16px;padding-left:4px;border-left:2px solid #c4c7d2}
.srow.lvl2 .sname{height:auto;min-height:24px;padding-top:3px;padding-bottom:3px;line-height:1.3;padding-left:8px;font-weight:500;font-size:12px;color:var(--text-2)}
.srow.lvl2.on .sname{color:var(--text);font-weight:700}
.tlink{border:0;background:transparent;padding:0;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:left}
.tlink:hover{color:var(--primary);text-decoration:underline}
.stbl tr.fixed td{background:#fafbfc;height:38px}
.srow .ddm{position:fixed;right:auto;min-width:240px;z-index:40}
.mdl.w-lg{width:min(100%,860px)}
.seg{display:inline-flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:26px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.cbadge{min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:10px;display:inline-grid;place-items:center;padding:0 4px}
.stbl{border:1px solid var(--border);border-radius:8px;overflow:visible}
.stbl table{width:100%;border-collapse:separate;border-spacing:0}
.stbl th{font-size:12px;font-weight:600;color:var(--text-2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);background:#fafafc}
.stbl th:first-child{border-top-left-radius:8px}.stbl th:last-child{border-top-right-radius:8px}
.stbl td{padding:3px 8px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px}
.stbl tbody tr:last-child td{border-bottom:0}
.stbl tbody tr:hover td{background:#fafafc}
.stbl .gcol{width:28px;padding-right:0}.stbl .acol{width:44px;text-align:center}
.stbl tr.trashed .ie{text-decoration:line-through;opacity:.45}
.stbl tr.trashed .t2{opacity:.45}
.fchip .x{border:0;background:none;padding:0;margin-left:2px;color:var(--muted);cursor:pointer;display:inline-flex}.fchip .x:hover{color:#d22422}
.kcard.kdrag{cursor:grab}.kcard.dragging{opacity:.45}
.kcol.kover{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--primary-6)}
.kcol.kno{opacity:.45}
.stbl tr.drop-top td{box-shadow:inset 0 2px 0 var(--primary)}
.stbl tr.drop-bot td{box-shadow:inset 0 -2px 0 var(--primary)}
.stbl tr.dragging td{opacity:.4}
.grip{display:inline-grid;place-items:center;cursor:grab;color:var(--muted);opacity:.45;padding:2px}
.grip:hover{opacity:1}
.iecell{display:flex;align-items:center;gap:6px}
.ie{width:100%;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 6px;font:inherit;font-size:12.5px;color:var(--text)}
.ie.b{font-weight:600}
.ie:hover:not(:disabled){border-color:var(--border-2)}
.ie:focus{outline:0;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(46,96,242,.12)}
.sel-ghost{border-color:transparent;background-color:transparent}
.sel-ghost:hover{border-color:var(--border-2)}
.ibtn{width:28px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--text-2);display:inline-grid;place-items:center}
.ibtn:hover:not(:disabled){background:var(--bg)}
.ibtn.red{color:#d22422}
.ibtn:disabled{opacity:.3;cursor:not-allowed}
.cdot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border-2);cursor:pointer;padding:0}
.cdot.sel{box-shadow:0 0 0 2px var(--primary)}
.cpal{left:0;right:auto;min-width:0;display:grid;grid-template-columns:repeat(5,20px);gap:8px;padding:10px}
.cpal button.cdot{width:20px;height:20px;padding:0;border-radius:50%}
.optbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer}
.optbtn:hover{border-color:var(--border-2);color:var(--text)}
.optbtn.noopt{border-style:dashed;color:var(--primary)}
tr.open td{background:#f7f9ff}
.optrow td{background:#f7f9ff;padding:0 8px 12px}
.opted{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.opth{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;font-size:12.5px}
.olist{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.orow{display:flex;align-items:center;gap:4px;border-radius:6px}
.orow.drop-top{box-shadow:inset 0 2px 0 var(--primary)}
.orow.drop-bot{box-shadow:inset 0 -2px 0 var(--primary)}
.orow .ie{height:28px}
.oadd{display:flex;gap:6px}
.oadd .inp{flex:1}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.sbox{background:var(--bg);border-radius:8px;padding:6px 8px;margin:2px 0;font-size:12px;color:var(--text-2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:8px 10px 10px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;height:24px;padding:0 4px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.crumbs b{color:var(--text-2);font-weight:600}
.panel{flex:1;min-height:0;background:var(--white);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.phead h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.phead .grow{flex:1}
.ptabs{display:flex;gap:4px;padding:0 14px 8px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.ptab{height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:8px;color:var(--text-2);font-weight:600;cursor:pointer;border:0;background:transparent;font-size:12.5px}
.ptab:hover{background:var(--bg)}
.ptab.on{background:var(--primary-6);color:var(--primary)}
.ptab .cnt{font-size:10.5px;background:var(--bg);color:var(--muted);border-radius:6px;padding:0 5px;line-height:16px}
.ptab.on .cnt{background:var(--primary-12);color:var(--primary)}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.pbody{flex:1;min-height:0;overflow:auto}
.pad{padding:14px}

/* ---------- controls ---------- */
.btn{height:32px;padding:0 11px;border-radius:8px;border:0;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap;transition:background .2s}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-h)}
.btn-s{background:var(--primary-6);color:var(--primary)}
.btn-s:hover{background:var(--primary-12)}
.btn-n{background:#f3f3f6;color:var(--text)}
.btn-n:hover{background:#e9e9f1}
.btn-g{background:transparent;color:var(--primary)}
.btn-g:hover{background:var(--primary-6)}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border-2)}
.btn-o:hover{border-color:#b6bcc8}
.btn-d{background:var(--red-bg);color:var(--red)}
.btn-ok{background:var(--green-bg);color:var(--green)}
.btn-sm{height:24px;padding:0 7px;border-radius:6px;font-size:11.5px}
.btn-i{width:32px;padding:0}
.btn-sm.btn-i{width:24px}
.btn:disabled{background:#e9e9f1;color:#a3abb9;cursor:not-allowed}
.inp,.sel,.ta{height:32px;border:1px solid var(--border-2);border-radius:8px;padding:0 10px;background:#fff;outline:none;font-size:12.5px;min-width:0}
.sel{padding-right:4px}
.ta{height:auto;min-height:72px;padding:8px 10px;resize:vertical;width:100%;line-height:1.45}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-12)}
.inp.err,.sel.err,.ta.err,.ms.err,.fbox.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.inp-sm,.sel-sm{height:24px;border-radius:6px;font-size:11.5px;padding:0 6px}
.w100{width:100%}
.errt{color:var(--red);font-size:11.5px;margin-top:4px;font-weight:600}
.hint{color:var(--muted);font-size:11.5px;margin-top:4px}
.req{color:var(--red);margin-left:2px}
.lbl2{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.frow{margin-bottom:14px}
.ms{border:1px solid var(--border-2);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 12px;background:#fff}
.ms label,.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.fbox{border:1px dashed var(--border-2);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg-2)}
.fbox input[type=file]{font-size:11.5px;max-width:100%}
input[type=checkbox]{accent-color:var(--primary);width:14px;height:14px}

.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-2);user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tr{width:30px;height:18px;border-radius:9px;background:#d7dae0;position:relative;transition:background .2s;flex-shrink:0}
.switch .tr:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .tr{background:var(--primary)}
.switch input:checked + .tr:after{left:14px}

.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.st-open{background:#e9e9f1;color:var(--text-2)}
.st-done{background:var(--green-bg);color:var(--green)}
.p-blue{background:var(--blue-bg);color:#1d4ed8}
.p-grey{background:var(--bg);color:var(--muted)}
.p-yel{background:var(--yellow-bg);color:var(--yellow)}
.p-red{background:var(--red-bg);color:var(--red)}
.p-pur{background:var(--purple-bg);color:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 3px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:600;color:var(--text);max-width:100%}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;padding:1px;border-radius:50%}
.chip .x:hover{background:#e2e5ec;color:var(--red)}
.fchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:11.5px;color:var(--text-2);font-weight:600}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex-shrink:0;letter-spacing:-.02em}
.fr{display:inline-flex;align-items:center;height:16px;font-size:9.5px;font-weight:800;color:#7e22ce;background:#f1e9fd;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle;white-space:nowrap;letter-spacing:.01em}
body.nofr .fr{display:none!important}
body.noph .ph,body.noph .fr{display:none!important}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-2);line-height:1.45}
.note.warn{background:#fffbeb;border-color:#fde68a;color:#854d0e}
.note.info{background:#f0f6fe;border-color:#c4dbfc;color:#233a89}
.note.lock{background:#f8fafc;border-color:#e2e8f0}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:700;color:var(--text-2);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.rw{cursor:pointer}
.tbl tr.rw:hover td{background:var(--bg-2)}
.tbl td.tt{font-weight:700;color:var(--text);max-width:380px}
.tbl td.tt .ttx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idn{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}
.ppl{display:flex;align-items:center;gap:5px;white-space:nowrap}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:10px;color:var(--text-2)}
.empty .eic{width:52px;height:52px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty h4{margin:0;font-size:15px;color:var(--text)}
.empty p{margin:0;max-width:360px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- kanban ---------- */
.kb{display:flex;gap:10px;padding:12px 14px;align-items:flex-start;min-height:100%}
.kcol{width:290px;flex:0 0 290px;background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.kcol h4{margin:2px 4px 4px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--border-2);box-shadow:0 2px 8px rgba(15,23,42,.06)}
.kcard b{font-size:12.5px;line-height:1.35}
.kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}

/* ---------- cards / sections ---------- */
.box{border:1px solid var(--border);border-radius:12px;background:#fff}
.box + .box{margin-top:10px}
.boxh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.boxh h3{margin:0;font-size:13.5px;font-weight:700}
.boxb{padding:10px 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer}
.qrow:hover{background:var(--bg-2)}
.qrow:first-child{border-top:0}

/* ---------- overlays ---------- */
.ovl{position:absolute;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
.ovl.top{z-index:70}
.mdl{background:#fff;border-radius:12px;box-shadow:var(--shadow-xl);width:min(100%,560px);display:flex;flex-direction:column;max-height:calc(100% - 20px)}
.mdl.w-sm{width:min(100%,440px)}
.mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.mh h2{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0}
.mb{padding:14px;overflow:auto;flex:1;min-height:0}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.mf .grow{flex:1;min-width:120px}

.sgroup{margin-bottom:12px}
.qh{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:#a1a1aa;cursor:help;outline:none;transition:color .15s}
.qh:hover,.qh:focus-visible{color:#52525b}
.qh .tipc{position:absolute;left:-14px;top:calc(100% + 8px);width:max-content;max-width:320px;padding:4px 12px;border-radius:8px;background:#27272a;color:#fff;font-size:12px;font-weight:700;line-height:1.6;letter-spacing:0;text-transform:none;white-space:normal;text-align:left;z-index:60;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
.qh .tipc:before{content:"";position:absolute;left:17px;top:-4px;width:10px;height:10px;background:#27272a;border-radius:2px;transform:rotate(45deg)}
.qh:hover .tipc,.qh:focus-visible .tipc{opacity:1;visibility:visible}
.sgroup .sgt{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;display:flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;width:100%;border-radius:6px;text-align:left}
.sgroup .sgt:hover{background:var(--bg);color:var(--text-2)}
.sgroup .sgt .cnt{font-weight:700;letter-spacing:0}
.sproj .chev{width:16px;display:inline-grid;place-items:center;color:var(--muted);flex-shrink:0}
.sproj:hover .chev,.sproj.on .chev{color:var(--primary)}
.sproj{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;margin-top:4px;font-weight:600;font-size:13px}
.sproj:hover{border-color:var(--border-2);background:var(--bg-2)}
.sproj.on{border-color:var(--primary);background:var(--primary-6)}
.sproj.dis{cursor:not-allowed;color:var(--muted);background:var(--bg-2)}
.stypes{padding:4px 0 2px 16px;display:flex;flex-direction:column;gap:3px}
.stype{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12.5px;color:var(--text-2);font-weight:600}
.stype:hover{background:var(--primary-6);color:var(--primary)}
.steps{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.step{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:3px 6px;border-radius:8px;font-size:12px;color:var(--muted);text-align:left;min-width:0;font-family:inherit}
button.step{cursor:pointer}
button.step:hover{background:var(--bg)}
.step .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:11.5px;background:#fff;border:1px solid var(--border-2);color:var(--muted)}
.step.on{color:var(--text);font-weight:700}
.step.on .sn{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .sn{background:var(--primary-6);border-color:var(--primary);color:var(--primary)}
.step .sl{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.step .sl b{color:var(--text);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sline{flex:1;height:1px;background:var(--border-2);min-width:12px}
.sq{margin:0 0 2px;font-size:15px}
.pgrp + .pgrp{margin-top:16px}
.pgrp-h{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px 2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pcard,.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);font-family:inherit}
.pcard>.ic:first-child,.trow>.ic:first-child{color:var(--primary);flex-shrink:0}
.pcard>.ic:last-child,.trow>.ic:last-child{color:var(--muted);flex-shrink:0}
.pcard:hover,.trow:hover{border-color:var(--primary);background:var(--primary-6)}
.pcard:hover>.ic:last-child,.trow:hover>.ic:last-child{color:var(--primary)}
.pc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pc-t b{font-size:13px;line-height:1.3}
.pc-t .muted{font-size:11.5px}
.trow + .trow{margin-top:6px}
.tbl .acol{width:1%;text-align:right;white-space:nowrap}
.lnk{border:0;background:transparent;padding:0;font:inherit;color:var(--primary);cursor:pointer}
.lnk:hover{text-decoration:underline}
.tblw{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tblw .tbl tr:last-child td{border-bottom:0}
.sect{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:14px}
.sect .cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:5px;padding:1px 6px}
.sp-grp + .sp-grp{margin-top:14px}
.sp-h{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;font-size:14px}
.sp-ico{width:26px;height:26px;border-radius:7px;background:var(--bg);color:var(--text-2);display:grid;place-items:center;flex-shrink:0}
.sp-h .muted{font-size:12px;font-weight:500}
.sp-list{margin-left:12px;padding-left:12px;border-left:2px solid #e4e5ec;display:flex;flex-direction:column;gap:2px}
.sp-proj{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text)}
.sp-proj b{flex:1;min-width:0;font-weight:600}
.sp-proj .muted{font-size:12px;white-space:nowrap}
.sp-proj>.ic{color:var(--muted)}
.sp-proj:hover{background:var(--primary-6)}
.sp-proj:hover>.ic{color:var(--primary)}
.qspace{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.qspace + .qspace{margin-top:14px}
.qsh{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.qsico{width:36px;height:36px;border-radius:10px;background:var(--primary-6);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.qst{flex:1;min-width:200px}
.apsec{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg-2);margin-top:4px}
.apsec-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;margin-bottom:4px}
.apsec-h .ic{color:var(--primary)}
.apf{border:1px solid var(--border);border-radius:8px;background:#fff;max-height:170px;overflow:auto}
.apf-i{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;border-top:1px solid var(--border)}
.apf-i:first-child{border-top:0}
.apf-i:hover{background:var(--bg-2)}
.apf-i span:nth-child(2){flex:1}
.apf-i .muted{font-size:11.5px}
.switch.dis{opacity:.5;cursor:not-allowed}
.qsa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qa{display:inline-flex;align-items:center;gap:6px}
.qst h3{margin:1px 0;font-size:15px}
.qst .muted{font-size:12px}
.kick{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.qtbl th{position:static}
.qtbl th:first-child{width:44%}
.qtbl tr:last-child td{border-bottom:0}
.qp{display:flex;align-items:center;gap:8px}
.qp>.ic{color:var(--muted);flex-shrink:0}
.qp>span{min-width:0}
.qps{display:block;font-weight:500;font-size:11.5px}
.qact{text-align:right;white-space:nowrap;color:var(--muted);width:1%}

.sel-path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:14px;font-size:12.5px}
mark{background:#fdf9c8;color:inherit;border-radius:2px}

/* request card */
.rc{background:#fff;border-radius:12px;box-shadow:var(--shadow-xl);width:min(100%,1120px);height:calc(100% - 8px);display:flex;flex-direction:column;overflow:hidden}
.rc.simple{width:min(100%,960px)}
.rch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.rch .path{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex:1;min-width:0;flex-wrap:wrap}
.rcb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.rcl{overflow:auto;padding:12px 14px 20px;background:var(--bg)}
.rcl .sec{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rcr{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.rct{margin:0 0 6px;font-size:18px;font-weight:700;line-height:1.3}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 20px;font-size:12.5px}
.prop{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;gap:8px;min-height:26px}
.prop .k{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.prop .v{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.fl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--border);align-items:start}
.fl:first-of-type{border-top:0}
.fl .k{color:var(--muted);font-weight:600;padding-top:6px;font-size:12.5px}
.fl .v{min-height:28px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12.5px;line-height:1.45}
.fl .v.ro{padding-top:5px}
.secT{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;font-weight:700}
.desc{white-space:pre-wrap;line-height:1.5;font-size:13px;color:var(--text-2)}
.rtabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--border)}
.cmts{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:8px}
.cmt .cb{flex:1;min-width:0;background:var(--bg);border-radius:10px;padding:7px 9px}
.cmt .ch{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;margin-bottom:3px}
.cmt .ch b{font-size:12px}
.cmt .ct{font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cmt.me .cb{background:#eef3fe}
.cform{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cform .row{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.hist{padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto;font-size:12px}
.hist div{display:flex;gap:8px}
.hist .tm{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dd{position:relative}
.ddm{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:250px;padding:5px;z-index:5}
.ddm button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.ddm button:hover{background:var(--bg)}
.ddm .hr{height:1px;background:var(--border);margin:4px 0}

.plist{display:flex;flex-direction:column;max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.plist .pg{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 4px;background:var(--bg-2);border-top:1px solid var(--border)}
.plist .pg:first-child{border-top:0}
.plist label,.plist button.pi{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;border:0;background:transparent;text-align:left;width:100%}
.plist label:hover,.plist button.pi:hover{background:var(--bg-2)}

.notif{position:absolute;left:44px;bottom:8px;top:8px;width:380px;max-width:calc(100% - 52px);background:#fff;border-radius:12px;box-shadow:var(--shadow-xl);z-index:60;display:flex;flex-direction:column;border:1px solid var(--border)}
.notif .nl{flex:1;overflow:auto;padding:4px 6px}
.ni{display:flex;gap:9px;padding:9px 8px;border-radius:8px;cursor:pointer;align-items:flex-start}
.ni:hover{background:var(--bg-2)}
.ni .nic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--primary-6);color:var(--primary)}
.ni .nic.mail{background:var(--orange-bg);color:var(--orange)}
.ni .nt{font-size:12.5px;line-height:1.4}
.ni.unread .nt{font-weight:700}
.ni .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0}
.toasts{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:90;max-width:min(380px,calc(100% - 28px))}
.toast{background:#0f172a;color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;box-shadow:var(--shadow-xl);line-height:1.4}

#scen{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:100%;background:#fff;box-shadow:-10px 0 40px rgba(15,23,42,.2);z-index:200;display:none;flex-direction:column}
#scen.open{display:flex}
#scen .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
#scen .sh h2{margin:0;font-size:15px;flex:1}
#scen .sb{overflow:auto;padding:12px 14px;flex:1}
.uj{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.uj h4{margin:0;padding:10px 12px;background:var(--bg-2);font-size:13px;border-bottom:1px solid var(--border)}
.uj ol{margin:0;padding:8px 12px 10px 30px;display:flex;flex-direction:column;gap:6px}
.uj li{font-size:12.5px;line-height:1.45;color:var(--text-2)}
.uj li button{margin-top:3px}

.mhead{display:none}
.stub-row td{color:var(--text-2)}

/* ---------- mobile (container query, 375 px) ---------- */
@container app (max-width: 700px){
  .rail,.side{display:none}
  .main{padding:0}
  .crumbs{display:none}
  .panel{border-radius:0;border:0}
  .mhead{display:flex;flex-direction:column;background:#fff;border-bottom:1px solid var(--border)}
  .mhead .mt{display:flex;align-items:center;gap:6px;padding:8px 10px}
  .mhead .mt b{flex:1;font-size:15px}
  .mhead .mnav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
  .mhead .mnav::-webkit-scrollbar{display:none}
  .phead{padding:10px 12px 6px}
  .phead h1{font-size:17px}
  .phead .hide-m,.ptabs.hide-m{display:none}
  .toolbar{padding:6px 12px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 12px;border-bottom:1px solid var(--border)}
  .tbl td{border:0;padding:1px 0;max-width:none!important}
  .tbl td.tt .ttx{white-space:normal}
  .tbl td[data-l]:before{content:attr(data-l) ": ";color:var(--muted);font-weight:600}
  .tbl td.m-hide{display:none}
  .ovl{padding:0;align-items:stretch}
  .mdl,.rc,.rc.simple{width:100%;max-height:none;height:100%;border-radius:0}
  .rcb{display:block;overflow:auto}
  .rcl{overflow:visible;padding:10px}
  .rcr{border-left:0;border-top:1px solid var(--border)}
  .cmts{overflow:visible}
  .props{grid-template-columns:1fr}
  .prop{grid-template-columns:110px minmax(0,1fr)}
  .fl{grid-template-columns:1fr;gap:2px}
  .fl .k{padding-top:0}
  .notif{left:6px;right:6px;width:auto;max-width:none}
  .grid2{grid-template-columns:1fr}
  .kb{flex-direction:column}
  .kcol{width:100%;flex:none}
  .empty{padding:40px 16px}
}

const isProjLead = (u, pid) => { const p = proj(pid); return !!p && p.leadId === u; };
const canSpaceSettings = (u, sid) => !!space(sid) && (isAdmin(u) || isSpaceLead(u, sid));
const canCreateProject = (u, sid) => !!space(sid) && (isAdmin(u) || isSpaceLead(u, sid));
const isMember = (u, pid) => { const p = proj(pid); return !!p && p.memberIds.includes(u); };
const internal = (u, pid) => { const p = proj(pid); return !!p && (p.leadId === u || p.memberIds.includes(u) || isSpaceLead(u, p.spaceId)); };
const canView = (u, pid) => internal(u, pid) || isAdmin(u);
const canProjSettings = (u, pid) => { const p = proj(pid); return !!p && (isAdmin(u) || p.leadId === u || isSpaceLead(u, p.spaceId)); };
function rr(u, r){ return {req: r.requesterId === u, part: r.participantIds.includes(u), exec: r.executorIds.includes(u)}; }
function access(u, r){ const x = rr(u, r); if (x.exec || canView(u, r.projectId)) return 'full'; if (x.req || x.part) return 'simple'; return 'none'; }
const canManageRequest = (u, r) => isAdmin(u) || isProjLead(u, r.projectId) || isSpaceLead(u, proj(r.projectId).spaceId);
const canComment = (u, r) => { const x = rr(u, r); return x.req || x.part || x.exec || canManageRequest(u, r); };
const canWork = (u, r) => rr(u, r).exec || canManageRequest(u, r);
const canTake = (u, r) => isMember(u, r.projectId) && !r.executorIds.includes(u) && !isDone(r);
function assignScope(u, r){
  const p = proj(r.projectId);
  if (isSpaceLead(u, p.spaceId) || isAdmin(u)) {
    const groups = S.projects.filter(x => x.spaceId === p.spaceId).map(x => ({title: x.name + (x.id === p.id ? ' (проект заявки)' : ''), people: uniq([x.leadId, ...x.memberIds])}));
    groups.unshift({title:isAdmin(u) ? 'Администратор' : 'Руководитель пространства', people:[u]});
    return {who:'space', groups};
  }
  if (p.leadId === u) return {who:'project', groups:[{title:p.name, people: uniq([p.leadId, ...p.memberIds])}]};
  return null;
}
const canAddPart = (u, r) => { const x = rr(u, r); return x.req || x.part || x.exec || canManageRequest(u, r); };
const canRmPart = (u, r, pid) => { const x = rr(u, r); return x.req || x.exec || canManageRequest(u, r) || (x.part && pid === u); };
function queueTree(u){
  return S.spaces.map(s => {
    const lead = s.leadId === u;
    const ps = S.projects.filter(p => p.spaceId === s.id && (lead || isAdmin(u) || p.leadId === u || p.memberIds.includes(u)));
    return {space:s, lead, projects:ps};
  }).filter(x => x.lead || isAdmin(u) || x.projects.length);
}
function setProjLead(p, lead){
  if (!lead || lead === p.leadId) return;
  const prev = p.leadId;
  p.memberIds = uniq([...p.memberIds.filter(m => m !== lead), prev]);
  p.leadId = lead;
}

const visibleTypes = pid => S.types.filter(t => t.projectId === pid && !t.hidden);
const typeFields = t => t.fields.filter(x => { const f = fld(x.f); return f && !f.hidden; });

function pushN(to, text, reqId, kind='bell'){ const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,6), to, at:nowIso(), kind, text, req:reqId, read:false}; S.notifs.push(n); return n; }
function externals(r){ return uniq([r.requesterId, ...r.participantIds]); }
function nComment(r, author){
  uniq([...externals(r), ...r.executorIds]).filter(u => u !== author).forEach(u => pushN(u, `${pname(author)} прокомментировал(а) заявку «${r.title}»`, r.id));
}
function nStatus(r, by){
  const st = stOf(r);
  externals(r).filter(u => u !== by && !r.executorIds.includes(u)).forEach(u => pushN(u, `Статус заявки «${r.title}»: ${st.name}`, r.id));
  r.executorIds.filter(u => u !== by).forEach(u => pushN(u, `${pname(by)} сменил(а) статус заявки «${r.title}»: ${st.name}`, r.id));
}
function nDeadline(r, by){ r.executorIds.filter(u => u !== by).forEach(u => pushN(u, `${pname(by)} изменил(а) срок заявки «${r.title}»: ${r.deadline ? fmtDT(r.deadline) : 'без срока'}`, r.id)); }
function nExecutors(r, by, added, removed){
  const all = uniq([...r.executorIds, ...removed]).filter(u => u !== by);
  all.forEach(u => {
    const parts = [];
    if (added.length) parts.push(`назначен(ы): ${added.map(pname).join(', ')}`);
    if (removed.length) parts.push(`сняты: ${removed.map(pname).join(', ')}`);
    pushN(u, `Исполнители заявки «${r.title}» изменены (${pname(by)}): ${parts.join('; ')}`, r.id);
  });
}
function nNew(r){
  const t = typ(r.typeId), p = proj(r.projectId);
  r.executorIds.forEach(u => { const n=pushN(u, `Пришла новая заявка №${r.id} — ${r.title}`, r.id, 'mail'); n.mail={space:space(p.spaceId).name,project:p.name,type:t.name,reporter:pname(r.requesterId),createdAt:r.createdAt}; });
  Object.keys(S.subs).filter(k => S.subs[k] && k.endsWith(':' + p.id)).map(k => k.split(':')[0])
    .filter(u => (internal(u, p.id) || isAdmin(u)) && !r.executorIds.includes(u) && u !== r.requesterId)
    .forEach(u => pushN(u, `Новая заявка в проекте «${p.name}»: «${r.title}»`, r.id));
}
function hist(r, by, text){ r.history.push({at:nowIso(), by, text}); }
function toast(text){ const id = Math.random(); UI.toasts.push({id, text}); renderToasts(); setTimeout(() => { UI.toasts = UI.toasts.filter(t => t.id !== id); renderToasts(); }, 4200); }

function route(){
  const h = decodeURIComponent(location.hash.slice(1)) || '/requests/mine';
  const [p, qs] = h.split('?');
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  return {path:p, parts:p.split('/').filter(Boolean), q};
}
function href(path, q={}){ const qs = new URLSearchParams(Object.entries(q).filter(([k,v]) => v != null && v !== '')).toString(); return '#' + path + (qs ? '?' + qs : ''); }
function go(path, q={}){ const h = href(path, q); if (location.hash === h) render(); else location.hash = h; }
function setQ(patch){ const r = route(); const q = {...r.q, ...patch}; Object.keys(q).forEach(k => (q[k] == null || q[k] === '') && delete q[k]); go(r.path, q); }

function applyFilters(list, q){
  return list.filter(x => {
    if (q.proj && x.projectId !== q.proj) return false;
    if (q.type && x.typeId !== q.type) return false;
    if (q.status === '@open' ? isDone(x) : q.status && x.status !== q.status) return false;
    if (q.noexec === '1' && x.executorIds.length) return false;
    if (q.ff && q.fv) {
      const t = typ(x.typeId); if (!t.fields.some(f => f.f === q.ff)) return false;
      const v = x.values[q.ff]; if (isEmpty(v)) return false;
      const f = fld(q.ff);
      if (f.kind === 'multi') return v.includes(q.fv);
      if (f.kind === 'select') return v === q.fv;
      return String(v).toLowerCase().includes(q.fv.toLowerCase());
    }
    return true;
  });
}

function saveSpaceModal(){
  const d = UI.spModal, s = space(d.sid);
  const err = (tab, text) => { d.err = text; d.tab = tab; render(); };
  if (d.statuses.some(x => !x.name.trim())) return err('statuses', 'У каждого статуса должно быть название');
  if (!d.statuses.some(x => x.final)) return err('statuses', 'Нужен хотя бы один завершающий статус');
  if (d.statuses[0].final) return err('statuses', 'Первый статус начальный и не может быть завершающим');
  if (d.statuses.some(x => finalLocked(d, x) && !x.final)) return err('statuses', 'С завершающего статуса, в котором есть заявки, нельзя снять признак «Завершающий»');
  const bad = d.fields.find(f => !f.name.trim());
  if (bad) return err('fields', 'У каждого поля должно быть название');
  for (const [i, f] of d.fields.entries()) {
    if (!isList(f.kind) || f.hidden) continue;
    const vs = (f.options || []).map(o => o.v.trim());
    if (!vs.length) { d.opts = i; return err('fields', `У поля «${f.name}» нет вариантов`); }
    if (vs.some(v => !v)) { d.opts = i; return err('fields', `У поля «${f.name}» есть вариант без названия`); }
    if (new Set(vs.map(v => v.toLowerCase())).size !== vs.length) { d.opts = i; return err('fields', `У поля «${f.name}» повторяются варианты`); }
  }
  s.statuses = d.statuses.map((x, i) => ({id: x.isNew ? 'st' + Date.now() + i : x.id, name: x.name.trim(), color: x.color || ST_COLORS[0], ...(x.final ? {final:true} : {})}));
  const others = S.fields.filter(f => f.spaceId !== d.sid);
  const mine = d.fields.map((f, i) => {
    const id = f.isNew ? 'f' + Date.now() + i : f.id;
    const list = isList(f.kind);
    if (list && !f.isNew) (f.options || []).forEach(o => { if (o.o && o.o !== o.v.trim()) S.requests.forEach(r => {
      const v = r.values[id]; if (Array.isArray(v)) r.values[id] = v.map(x => x === o.o ? o.v.trim() : x); else if (v === o.o) r.values[id] = o.v.trim(); }); });
    return {id, spaceId: d.sid, name: f.name.trim(), kind: f.kind, ...(f.options && (list || f.options.length) ? {options: f.options.map(o => o.v.trim()).filter(Boolean)} : {}), ...(f.hidden ? {hidden:true} : {})};
  });
  S.fields = others.concat(mine);
  S.projects.filter(p => p.spaceId === d.sid).forEach(p => setProjLead(p, d.leads[p.id]));
  toast(`Настройки пространства ${s.name} сохранены`);
  closeSpaceModal();
}

function addOptions(fi, text){
  const f = UI.spModal.fields[fi]; f.options = f.options || [];
  text.split(/\r?\n/).map(v => v.trim()).filter(Boolean).forEach(v => { if (!f.options.some(o => o.v.trim().toLowerCase() === v.toLowerCase())) f.options.push({o:null, v}); });
}

function archiveItem(kind, id){
  if (kind === 'project') {
    const p = proj(id);
    S.arch.push({id:'a' + Date.now(), kind, at:nowIso(), data:{project:p, types:S.types.filter(t => t.projectId === id), requests:S.requests.filter(r => r.projectId === id)}});
    S.projects = S.projects.filter(x => x.id !== id); S.types = S.types.filter(t => t.projectId !== id); S.requests = S.requests.filter(r => r.projectId !== id);
    return p.name;
  }
  const s = space(id), pids = S.projects.filter(p => p.spaceId === id).map(p => p.id);
  S.arch.push({id:'a' + Date.now(), kind, at:nowIso(), data:{space:s, projects:S.projects.filter(p => pids.includes(p.id)), types:S.types.filter(t => pids.includes(t.projectId)), requests:S.requests.filter(r => pids.includes(r.projectId)), fields:S.fields.filter(f => f.spaceId === id)}});
  S.spaces = S.spaces.filter(x => x.id !== id); S.projects = S.projects.filter(p => !pids.includes(p.id)); S.types = S.types.filter(t => !pids.includes(t.projectId));
  S.requests = S.requests.filter(r => !pids.includes(r.projectId)); S.fields = S.fields.filter(f => f.spaceId !== id);
  return s.name;
}
function restoreItem(aid){
  const a = S.arch.find(x => x.id === aid); if (!a) return;

function hl(text, q){ if (!q) return esc(text); const i = text.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(text); return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length)); }
function submitProjects(){ return S.spaces.map(s => ({s, ps: S.projects.filter(p => p.spaceId === s.id && visibleTypes(p.id).length)})).filter(g => g.ps.length); }
function submitList(){
  const st = UI.submit; const q = (st.q || '').trim().toLowerCase();
  const groups = submitProjects();
  if (!groups.length) return `<div class="empty" style="padding:30px"><p>Сейчас нет проектов, в которые можно подать заявку</p></div>`;
  if (!q) return groups.map(g => `<div class="sp-grp"><div class="sp-h"><span class="sp-ico">${icon('disc',15)}</span><b>${esc(g.s.name)}</b><span class="muted">пространство · ${g.ps.length} ${plural(g.ps.length,'проект','проекта','проектов')}</span></div>
    <div class="sp-list">${g.ps.map(p => { const n = visibleTypes(p.id).length; return `<button class="sp-proj" data-a="s-proj" data-pid="${p.id}">${icon('clip',15)}<b>${esc(p.name)}</b><span class="muted">${n} ${plural(n,'тип заявки','типа заявок','типов заявок')}</span>${icon('right',15)}</button>`; }).join('')}</div></div>`).join('');
  const ps = [], ts = [];
  groups.forEach(g => g.ps.forEach(p => { if (p.name.toLowerCase().includes(q)) ps.push(p); visibleTypes(p.id).forEach(x => { if (x.name.toLowerCase().includes(q)) ts.push(x); }); }));
  if (!ps.length && !ts.length) return `<div class="empty" style="padding:30px"><p>Ничего не найдено по запросу «${esc(st.q)}»</p></div>`;
  return `${ts.length ? `<div class="pgrp"><div class="pgrp-h">Типы заявок</div>${ts.map(x => { const pr = proj(x.projectId); return `<button class="trow" data-a="s-type" data-tid="${x.id}">${icon('tag',15)}<span class="pc-t"><b>${hl(x.name, st.q)}</b><span class="muted">${esc(space(pr.spaceId).name)} · ${esc(pr.name)}</span></span>${icon('right',15)}</button>`; }).join('')}</div>` : ''}
    ${ps.length ? `<div class="pgrp"><div class="pgrp-h">Проекты</div>${ps.map(pr => `<button class="trow" data-a="s-proj" data-pid="${pr.id}">${icon('clip',15)}<span class="pc-t"><b>${hl(pr.name, st.q)}</b><span class="muted">Пространство ${esc(space(pr.spaceId).name)}</span></span>${icon('right',15)}</button>`).join('')}</div>` : ''}`;
}
function submitSteps(step){
  const st = UI.submit; const pr = st.pid && proj(st.pid), ty = st.tid && typ(st.tid);
  const items = [['Проект', pr && pr.name], ['Тип заявки', ty && ty.name], ['Описание', null]];
  return `<div class="steps">${items.map(([l, v], i) => {
    const n = i + 1, cls = n < step ? 'done' : n === step ? 'on' : '';
    const inner = `<span class="sn">${n < step ? icon('ok',12) : n}</span><span class="sl"><span>${l}</span>${n < step && v ? `<b>${esc(v)}</b>` : ''}</span>`;
    return (i ? '<span class="sline"></span>' : '') + (n < step ? `<button class="step ${cls}" data-a="s-step" data-v="${n}" title="Изменить">${inner}</button>` : `<div class="step ${cls}">${inner}</div>`);
  }).join('')}</div>`;
}

      <div>${visibleTypes(pr.id).map(x => `<button class="trow" data-a="s-type" data-tid="${x.id}">${icon('tag',15)}<span class="pc-t"><b>${esc(x.name)}</b></span>${icon('right',15)}</button>`).join('')}</div>`;
    foot = `<button class="btn btn-g" data-a="s-step" data-v="1">${icon('left',14)}Другой проект</button><span class="grow"></span><button class="btn btn-n" data-a="s-close">Отмена</button>`;

      <div class="frow"><label class="lbl2">Название<span class="req">*</span></label><input class="inp w100 ${e.title?'err':''}" id="sf_title" value="${esc(v.title||'')}" placeholder="Коротко, о чём заявка">${e.title?`<div class="errt">${e.title}</div>`:''}</div>

function readSubmitVals(){

function doSubmit(){

  e.preventDefault(); addOptions(+e.target.dataset.fi, text); render();
  const m = document.getElementById('oNew'); if (m) m.focus();
});
let DND = null;
const dndList = k => { if (k === 't') return UI.typeDraft && UI.typeDraft.fields; const d = UI.spModal; if (!d) return null; if (k === 's') return d.statuses; if (k === 'f') return d.fields; if (k[0] === 'o') return d.fields[+k.slice(1)].options; return null; };
function clearDrop(){ document.querySelectorAll('.drop-top,.drop-bot,.dragging').forEach(x => x.classList.remove('drop-top','drop-bot','dragging')); }
let KB = null;
let pointerKanban = null, suppressKanbanClickUntil = 0;
const kbClear = () => document.querySelectorAll('.kover,.kno,.kcard.dragging').forEach(x => x.classList.remove('kover','kno','dragging'));
// Pointer-based kanban dragging also works where native HTML5 drag is unavailable.
document.addEventListener('pointerdown', e => {
  const card=e.target.closest('[data-kb]');
  if (!card || e.button!==0) return;
  const r=req(card.dataset.kb); if(!canWork(me(),r)) return;
  pointerKanban={r,card,x:e.clientX,y:e.clientY,moved:false};
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  const d=pointerKanban; if(!d) return;
  if(!d.moved && Math.hypot(e.clientX-d.x,e.clientY-d.y)<6) return;
  d.moved=true; d.card.classList.add('dragging');
  document.querySelectorAll('.kover').forEach(x=>x.classList.remove('kover'));
  const hit=document.elementFromPoint(e.clientX,e.clientY), col=hit&&hit.closest('[data-kcol]');
  if(col){ const st=reqSpace(d.r).statuses.find(s=>s.id===col.dataset.kcol); if(st&&canMoveTo(me(),d.r,st)) col.classList.add('kover'); }
  e.preventDefault();
});
document.addEventListener('pointerup', e => {
  const d=pointerKanban; pointerKanban=null; if(!d||!d.moved) return;
  suppressKanbanClickUntil=Date.now()+350;
  const hit=document.elementFromPoint(e.clientX,e.clientY), col=hit&&hit.closest('[data-kcol]');
  kbClear();
  if(col) changeStatus(d.r,col.dataset.kcol);
  render();
});
document.addEventListener('pointercancel', () => { pointerKanban=null; kbClear(); });

document.addEventListener('dragstart', e => {
  const kc = e.target.closest && e.target.closest('[data-kb]');
  if (kc) {
    const r = req(kc.dataset.kb), sp = reqSpace(r), u = me();
    KB = r; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
    setTimeout(() => { kc.classList.add('dragging'); document.querySelectorAll('[data-kcol]').forEach(c => { const st = sp.statuses.find(s => s.id === c.dataset.kcol); if (st.id !== r.status && !canMoveTo(u, r, st)) c.classList.add('kno'); }); }, 0);
    return;
  }
  const g = e.target.closest && e.target.closest('[data-dnd]'); if (!g) return;
  DND = {k: g.dataset.dnd, i: +g.dataset.i};
  const row = g.closest('[data-dnd-row]');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
  if (row) { e.dataTransfer.setDragImage(row, 20, 14); setTimeout(() => row.classList.add('dragging'), 0); }
});
document.addEventListener('dragover', e => {
  if (KB) {
    const c = e.target.closest && e.target.closest('[data-kcol]');
    document.querySelectorAll('.kover').forEach(x => x !== c && x.classList.remove('kover'));
    if (!c) return;
    const st = reqSpace(KB).statuses.find(s => s.id === c.dataset.kcol);
    if (canMoveTo(me(), KB, st)) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; c.classList.add('kover'); }
    return;
  }
  if (!DND) return;
  const row = e.target.closest && e.target.closest(`[data-dnd-row="${DND.k}"]`); if (!row) return;
  e.preventDefault(); clearDrop();
  const r = row.getBoundingClientRect(); row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-top' : 'drop-bot');
});
document.addEventListener('drop', e => {
  if (KB) {
    const c = e.target.closest && e.target.closest('[data-kcol]'); const r = KB; KB = null; kbClear();
    if (c) { e.preventDefault(); changeStatus(r, c.dataset.kcol); }
    render(); return;
  }
  if (!DND) return;
  const row = e.target.closest && e.target.closest(`[data-dnd-row="${DND.k}"]`);
  if (row) {
    e.preventDefault();
    const r = row.getBoundingClientRect(); const to = +row.dataset.i + (e.clientY < r.top + r.height / 2 ? 0 : 1);
    const list = dndList(DND.k);
    if (list && to !== DND.i && to !== DND.i + 1) {
      const d = UI.spModal; const openName = d && d.opts != null ? d.fields[d.opts] : null;
      if (DND.k === 't') syncDraftName();
      moveItem(list, DND.i, to);
      if (openName) d.opts = d.fields.indexOf(openName);
    }
  }
  DND = null; clearDrop(); render();
});
document.addEventListener('dragend', () => { DND = null; clearDrop(); KB = null; kbClear(); });
function focusLast(sel){ const all = document.querySelectorAll(sel); if (all.length) all[all.length - 1].focus(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'oNew') { e.preventDefault(); A['o-add'](e.target); return; }
  if (e.key === 'Escape') {
    if (UI.confirm) { UI.confirm = null; render(); }
    else if (UI.adminNew) A['admin-new-close']();
    else if (UI.adminEdit) A['admin-edit-close']();
    else if (UI.spModal && UI.spModal.color != null) { UI.spModal.color = null; render(); }
    else if (UI.spModal) closeSpaceModal();
    else if (UI.pjModal) { if (UI.typeDraft) { UI.typeDraft = null; render(); } else closeProjModal(); }
    else if (UI.picker) { UI.picker = null; render(); }
    else if (UI.submit) { UI.submit = null; render(); }
    else if (route().q.card) A['close-card']();
    else if (UI.notifOpen) { UI.notifOpen = false; render(); }
  }
  if (e.key === 'Enter' && e.target.id === 'openNum') A['open-num']();
});

if (!location.hash) location.hash = '#/requests/mine';
render();
</script>
